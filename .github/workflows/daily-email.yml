name: AI Content OS Daily Email

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        - name: Restore content history
        uses: actions/cache/restore@v4
        with:
          path: backend/history
          key: ai-content-history-${{ github.run_id }}
          restore-keys: |
            ai-content-history-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily content pipeline
            - name: Save updated content history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/history
          key: ai-content-history-${{ github.run_id }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: python run_daily_job.py